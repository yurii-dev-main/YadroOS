<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YadroOS Offline</title>
    <style>
      body {
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 1.5rem;
        text-align: center;
      }
      .card {
        max-width: 360px;
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(30, 41, 59, 0.8);
        border-radius: 1.5rem;
        padding: 2rem;
        backdrop-filter: blur(12px);
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 1rem;
      }
      p {
        font-size: 1rem;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Немає підключення</h1>
      <p>Ви офлайн. Поверніться до мережі, щоб продовжити роботу з YadroOS.</p>
    </div>
  </body>
</html>
